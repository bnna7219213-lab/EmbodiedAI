[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-ai"
version = "0.1.0"
description = "EmbodiedAI: AI 神经网络模型 → PCB 硬件 → 电机驱动 → 具身智能体 全链条研发 (三栈分离: 控制L/物理P/数据D/安全S横切)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pyyaml"]

[project.scripts]
embodied-audit = "embodied_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
