# 安全链分段延迟预算 (safety_budget.yaml)
# ============================================================
# 契约角色: 横切安全层 S 的分段延迟预算 — 唯一真源
# 数值来源: EdaLab RelayClutchDynamicsEngine 实测输出 (2026-09-20)
#   48V/30A 安全关断继电器 + 关节制动离合器样例:
#   "电气 0.8µs + 熄弧 8.0ms + 机械隔离 8.0ms = 总 16.00ms (目标 <20ms) PASS"
# 对应文档: docs/04-hardware/hardware-motor-shutdown.md + 08-cross-project-fusion 创新 #4 (软硬两级安全滤波器)
# 版本: v1.0 | 日期: 2026-09-20
# ============================================================

metadata:
  standard_target: "ISO 13849 PL d / IEC 61508 SIL2"
  validated_by: "edalab relay-clutch smoke test (BUILD SUCCESSFUL, 2026-09-20)"
  stop_category: CAT_0_IMMEDIATE

# ---- 分段预算 (自上而下 = 物理底线, 不可被软件层挪用) ----
segments:
  - stage: electrical_off        # 电气关断 (比较器+锁存, 独立于 MCU)
    budget_us: 0.8
    measured_us: 0.8
    owner: "P4 电机驱动 PCB 硬件比较器"
    principle: "不可软件实现 (核心原则 1)"

  - stage: arc_extinction       # 触点电弧熄灭
    budget_ms: 8.0
    measured_ms: 8.0
    owner: "SAFETY_SHUTDOWN 继电器触点"
    note: "AgSnO2 材料侵蚀寿命 0.37 年 → CRITICAL: 需 RC 熄弧或降额 (relay-clutch 实测 WARN)"

  - stage: mechanical_isolation  # 机械隔离 (触点间隙形成)
    budget_ms: 8.0
    measured_ms: 8.0
    owner: "继电器行程结构"
    note: "总断开 = 0.8µs + 8 + 8 ≈ 16ms < 20ms 预算, 余量 4ms"

# ---- 上层软件滤波段 (概率性安全, 各层预算) ----
software_filters:
  - stage: chance_constrained_grip   # 机会约束握力滤波
    rate_hz: 1000
    owner: "L3 反射伺服"
    formula: "f_n >= |f_t| / (mu_hat - z*sigma_mu), z=2.0"
  - stage: rl_action_envelope       # RL 动作安全包络投影 (CWC)
    rate_hz: 20
    owner: "L4 运动控制"
    note: "接触 wrench 锥投影, 输入 dr_params.mu 分布"

# ---- 验收判据 ----
acceptance:
  total_break_max_ms: 20
  stop_angle_max_deg: 30          # 人机共存缠绕防护
  sil2_pfh_target: 1.0e-6
  measured_pfh: 4.0e-8            # MultiPhysicsCoupler SafetyChain 实测
  sff_percent: 90                 # 双通道冗余时 99
  deterministic: "totalStop < 10ms && independently_powered"
